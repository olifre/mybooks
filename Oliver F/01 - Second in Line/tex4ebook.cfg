\Preamble{xhtml,html5,charset="utf-8"}
\Configure{FontFamily}{Georgia, serif}{Latin Modern}
\Configure{@HEAD}{\HCode{<meta name="author" content="}\myauthor{}\HCode{" />\Hnewline}}
\Configure{@HEAD}{\HCode{<meta data-custom-data="data-custom-data" data-sourcefile="}\currfiledir{}\currfilename{}\HCode{" -->\Hnewline}}
\Configure{@HEAD}{\HCode{<!-- sourcefile = "}\currfiledir{}\currfilename{}\HCode{" -->\Hnewline}}
\newcommand{\booksubjectsdc}{}
\renewcommand{\do}[1]{\appto\booksubjectsdc{<dc:subject>#1</dc:subject>}}
\expandafter\docsvlist\expandafter{\booksubjects}
\Configure{OpfMetadata}{%
  \HCode{\booksubjectsdc}%
  \HCode{<dc:description>\shortdesc</dc:description>}
  \HCode{<dc:publisher>\publisher</dc:publisher>}
  \HCode{<meta content="\seriestitle" name="calibre:series"/>}
  \HCode{<meta content="\seriesnumber" name="calibre:series_index"/>}
}
\Configure{OpfScheme}{URI}
\Configure{UniqueIdentifier}{\uniqueidprefix\jobname}
% Speaker annotations
\renewcommand{\say}[2]{%
  \HCode{<span class="speech" data-speaker="#1" data-ssml-voice-name="#1">}\enquote{#2}\HCode{</span>}%
}
\renewcommand{\think}[2]{%
  \HCode{<span class="thought" data-speaker="#1" data-ssml-voice-name="#1-Whisper" data-ssml-prosody-volume="soft" data-ssml-prosody-pitch="low">}\enquote{#2}\HCode{</span>}%
}
\begin{document}
\EndPreamble
